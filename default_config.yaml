compute_environment: LOCAL_MACHINE
debug: false  # 建议改为 false，减少不必要的日志开销
distributed_type: FSDP
downcast_bf16: 'no'
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false        # ⚠️ 修改点 1：T4 显存够的话建议先设为 false，提升速度
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_version: 1                   # ⚠️ 修改点 2：必须改为 1
  fsdp_transformer_layer_cls_to_wrap: PhiDecoderLayer # ⚠️ 修改点 3：Phi-3 必须指定这个层名
  fsdp_use_orig_params: true         # ⚠️ 修改点 4：增加这一行，确保兼容性
machine_rank: 0
main_training_function: main
mixed_precision: fp16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
